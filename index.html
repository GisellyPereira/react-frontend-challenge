<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      ;(() => {
        let theme = window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light'
        try {
          const saved = JSON.parse(
            localStorage.getItem('libris:theme') || 'null',
          )
          if (
            saved?.version === 1 &&
            ['light', 'dark'].includes(saved?.state?.theme)
          ) {
            theme = saved.state.theme
          }
        } catch {}
        document.documentElement.classList.toggle('dark', theme === 'dark')
        document.documentElement.style.colorScheme = theme
      })()
    </script>
    <meta
      name="description"
      content="Libris, sua biblioteca pessoal para descobrir e organizar leituras."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/src/shared/assets/libris-favicon.svg"
    />
    <title>Libris</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
